<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio | Kontak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico?v=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = { darkMode: "class" };
      if (
        localStorage.getItem("theme") === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>
  </head>
  <body class="bg-rose-600 dark:bg-slate-900 transition-colors duration-300 text-white min-h-screen">
    <nav class="bg-rose-600 dark:bg-slate-800 flex flex-col md:flex-row justify-between items-center px-6 py-4 text-white sticky top-0 z-50 border-b border-white/20 shadow-lg">
      <div class="text-xl font-black mb-2 md:mb-0 uppercase tracking-tighter">
        Let's work together
      </div>
      <div class="flex gap-4 md:gap-8 font-bold text-[10px] md:text-sm uppercase tracking-widest items-center">
        <a href="index.html" class="opacity-70 hover:opacity-100">Home</a>
        <a href="portofolio.html" class="opacity-70 hover:opacity-100">Portofolio</a>
        <a href="contact.html" class="border-b-2 border-white">Contact</a>
        <button id="theme-toggle" class="p-2 bg-white/10 rounded-lg">
          <span id="theme-toggle-icon">🌙</span>
        </button>
      </div>
    </nav>

    <main class="px-6 py-10 lg:px-20 lg:py-20">
      <div class="flex flex-col lg:flex-row gap-12 items-start">
        <div class="w-full lg:w-1/2">
          <h2 class="text-4xl md:text-6xl lg:text-7xl font-black uppercase leading-tight mb-8">
            Ayo <br>
            Kerjasama dengan saya!
          </h2>
          <div class="space-y-6 text-sm md:text-base">
            <div class="flex items-center gap-4">
              <i class="fas fa-location-dot w-6 text-center text-xl"></i>
              <p>Surakarta, Indonesia</p>
            </div>
            <a href="mailto:annasardiansyah236@gmail.com" class="flex items-center gap-4 hover:text-slate-900 transition">
              <i class="fas fa-envelope w-6 text-center text-xl"></i>
              <p>annasardiansyah236@gmail.com</p>
            </a>
            <a href="https://wa.me/6281259745752" target="_blank" class="flex items-center gap-4 hover:text-slate-900 transition">
              <i class="fab fa-whatsapp w-6 text-center text-xl"></i>
              <p>+62 812 5974 5752</p>
            </a>
            <a href="https://instagram.com/muhammadd.annas" target="_blank" class="flex items-center gap-4 hover:text-slate-900 transition">
              <i class="fab fa-instagram w-6 text-center text-xl"></i>
              <p>@muhammadd.annas</p>
            </a>
          </div>
        </div>

        <div class="w-full lg:w-1/2 bg-white dark:bg-slate-800 p-8 rounded-xl shadow-2xl text-slate-900 dark:text-white">
          <form id="contactForm" action="https://formspree.io/f/xzdoaelv" method="POST">
            <div class="mb-6">
              <label class="block text-[10px] font-black uppercase text-slate-400 mb-2">Nama Lengkap</label>
              <input type="text" name="name" required placeholder="Masukkan nama" class="w-full bg-transparent border-b-2 border-rose-600 py-2 outline-none focus:border-slate-900 dark:focus:border-white transition">
            </div>
            <div class="mb-6">
              <label class="block text-[10px] font-black uppercase text-slate-400 mb-2">Email</label>
              <input type="email" name="email" required placeholder="Masukkan email" class="w-full bg-transparent border-b-2 border-rose-600 py-2 outline-none focus:border-slate-900 dark:focus:border-white transition">
            </div>
            <div class="mb-8">
              <label class="block text-[10px] font-black uppercase text-slate-400 mb-2">Pesan</label>
              <textarea name="message" rows="3" required placeholder="Tulis pesan..." class="w-full bg-transparent border-b-2 border-rose-600 py-2 outline-none focus:border-slate-900 dark:focus:border-white transition resize-none"></textarea>
            </div>
            <button type="submit" class="w-full bg-rose-600 text-white font-black uppercase py-4 tracking-widest hover:bg-slate-900 transition shadow-lg">
              Kirim Sekarang
            </button>
          </form>

          <div id="notif" class="mt-6 p-4 bg-green-500 text-white font-bold rounded-lg text-center hidden">
            ✓ Pesan Berhasil Terkirim!
          </div>
        </div>
      </div>
    </main>

    <button onclick="tampilkanMotto()" class="fixed bottom-6 right-6 z-[100] bg-yellow-400 hover:bg-yellow-500 text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform flex items-center justify-center border-4 border-white">
      <i class="fas fa-cat text-2xl text-slate-800"></i>
    </button>

    <div id="mottoBox" class="fixed inset-0 flex items-center justify-center z-[110] hidden bg-black/50 backdrop-blur-sm">
      <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-2xl text-center max-w-xs border-4 border-yellow-400">
        <h3 class="text-rose-600 font-black uppercase tracking-tighter mb-4 text-xl">
          Motto Saya:
        </h3>
        <p class="text-slate-900 dark:text-white font-bold italic leading-relaxed">
          "Menjadi Manusia yang Bermanfaat bagi Manusia lain"
        </p>
        <button onclick="tampilkanMotto()" class="mt-6 bg-rose-600 text-white px-6 py-2 rounded-full font-black uppercase text-xs">
          Mantap!
        </button>
      </div>
    </div>

    <script>
      function tampilkanMotto() {
        const box = document.getElementById("mottoBox");
        box.classList.toggle("hidden");
      }
    </script>

    <script>
      const themeToggleBtn = document.getElementById("theme-toggle");
      const themeToggleIcon = document.getElementById("theme-toggle-icon");
      const updateIcon = () => {
        themeToggleIcon.innerText = document.documentElement.classList.contains(
          "dark",
        )
          ? "☀️"
          : "🌙";
      };
      updateIcon();
      themeToggleBtn.addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
        localStorage.setItem(
          "theme",
          document.documentElement.classList.contains("dark")
            ? "dark"
            : "light",
        );
        updateIcon();
      });

      const form = document.getElementById("contactForm");
      const notif = document.getElementById("notif");

      form.onsubmit = function () {
        notif.classList.remove("hidden");
        setTimeout(() => {
          notif.classList.add("hidden");
          form.reset();
        }, 5000);
      };
    </script>
  </body>
</html>
