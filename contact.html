<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | Kontak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = { darkMode: "class" };
      if (
        localStorage.getItem("theme") === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-rose-600 dark:bg-slate-900 transition-colors duration-300 text-white min-h-screen"
  >
    <nav
      class="bg-rose-600 dark:bg-slate-800 flex justify-between items-center px-10 py-6 text-white border-b border-white/20 sticky top-0 z-50"
    >
      <div class="text-2xl font-black tracking-tighter">PEMROGRAMAN WEB</div>
      <div
        class="flex gap-8 font-bold text-sm uppercase tracking-widest items-center"
      >
        <a href="index.html" class="opacity-70 hover:opacity-100">Home</a>
        <a href="portofolio.html" class="opacity-70 hover:opacity-100"
          >Portfolio</a
        >
        <a href="contact.html" class="active border-b-2 border-white"
          >Contact</a
        >
        <button
          id="theme-toggle"
          class="p-2 bg-white/10 rounded-lg hover:bg-white/20 transition"
        >
          <span id="theme-toggle-icon">🌙</span>
        </button>
      </div>
    </nav>

    <main
      class="flex flex-col lg:flex-row items-center justify-between p-10 lg:p-20 gap-10"
    >
      <div class="flex-1 text-left">
        <h2 class="text-6xl lg:text-8xl font-black uppercase leading-none mb-8">
          Ayo <br />
          Kerjasama!
        </h2>
        <div class="space-y-4 text-xl opacity-90 font-medium">
          <p class="flex items-center gap-3">
            <i class="fas fa-map-marker-alt w-8 text-center"></i> Surakarta,
            Indonesia
          </p>

          <a
            href="mailto:annasardiansyah236@gmail.com"
            class="flex items-center gap-3 hover:text-rose-300 transition-all w-fit"
          >
            <i class="fas fa-envelope w-8 text-center"></i>
            annasardiansyah236@gmail.com
          </a>

          <a
            href="https://wa.me/6281259745752"
            target="_blank"
            class="flex items-center gap-3 hover:text-rose-300 transition-all w-fit"
          >
            <i class="fab fa-whatsapp w-8 text-center text-2xl"></i> +62 812
            5974 5752
          </a>

          <a
            href="https://instagram.com/muhammadd.annas"
            target="_blank"
            class="flex items-center gap-3 hover:text-rose-300 transition-all w-fit"
          >
            <i class="fab fa-instagram w-8 text-center text-2xl"></i>
            @muhammadd.annas
          </a>
        </div>
      </div>

      <div
        class="w-full lg:w-[500px] bg-white dark:bg-slate-800 p-8 shadow-2xl rounded-sm text-slate-800 dark:text-white transition-colors"
      >
        <form
          id="contact-form"
          action="https://formspree.io/f/mnjwzgln"
          method="POST"
          class="space-y-6"
        >
          <div>
            <label
              class="block text-xs font-black uppercase text-slate-500 dark:text-slate-400 mb-2"
              >Nama Lengkap</label
            >
            <input
              type="text"
              name="nama"
              required
              class="w-full border-b-2 border-rose-600 dark:bg-transparent outline-none py-2 dark:text-white"
              placeholder="Masukkan nama"
            />
          </div>
          <div>
            <label
              class="block text-xs font-black uppercase text-slate-500 dark:text-slate-400 mb-2"
              >Email</label
            >
            <input
              type="email"
              name="email"
              required
              class="w-full border-b-2 border-rose-600 dark:bg-transparent outline-none py-2 dark:text-white"
              placeholder="email@gmail.com"
            />
          </div>
          <div>
            <label
              class="block text-xs font-black uppercase text-slate-500 dark:text-slate-400 mb-2"
              >Pesan</label
            >
            <textarea
              name="pesan"
              rows="4"
              required
              class="w-full border-b-2 border-rose-600 dark:bg-transparent outline-none py-2 dark:text-white"
              placeholder="Tulis pesan..."
            ></textarea>
          </div>
          <button
            type="submit"
            id="submit-btn"
            class="w-full bg-rose-600 text-white py-4 font-black uppercase tracking-widest hover:bg-slate-900 transition"
          >
            Kirim Sekarang
          </button>
        </form>
      </div>
    </main>

    <script>
      const themeToggleBtn = document.getElementById("theme-toggle");
      const themeToggleIcon = document.getElementById("theme-toggle-icon");
      const updateIcon = () => {
        themeToggleIcon.innerText = document.documentElement.classList.contains(
          "dark",
        )
          ? "☀️"
          : "🌙";
      };
      updateIcon();
      themeToggleBtn.addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
        localStorage.setItem(
          "theme",
          document.documentElement.classList.contains("dark")
            ? "dark"
            : "light",
        );
        updateIcon();
      });

      const form = document.getElementById("contact-form");
      const button = document.getElementById("submit-btn");
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        button.disabled = true;
        button.innerText = "MENGIRIM...";
        try {
          const response = await fetch(form.action, {
            method: "POST",
            body: new FormData(form),
            headers: { Accept: "application/json" },
          });
          if (response.ok) {
            Swal.fire({
              title: "Berhasil!",
              text: "Pesan Anda telah terkirim.",
              icon: "success",
              confirmButtonColor: "#e11d48",
            });
            form.reset();
          }
        } catch (error) {
          Swal.fire("Oops...", "Terjadi kesalahan.", "error");
        } finally {
          button.disabled = false;
          button.innerText = "Kirim Sekarang";
        }
      });
    </script>
  </body>
</html>
