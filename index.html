<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portofolio | Beranda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = { darkMode: "class" };
      if (
        localStorage.getItem("theme") === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .bg-red-main {
        background-color: #e11d48;
      }
      .text-shadow-custom {
        text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.7);
      }
      .overlay-gradient {
        background: linear-gradient(
          to right,
          rgba(0, 0, 0, 0.8) 30%,
          rgba(0, 0, 0, 0.2) 100%
        );
      }
    </style>
  </head>
  <body class="bg-white dark:bg-slate-900 transition-colors duration-300">
    <nav
      class="bg-red-main dark:bg-slate-800 flex justify-between items-center px-10 py-6 text-white border-b border-white/20 sticky top-0 z-50"
    >
      <div class="text-2xl font-black tracking-tighter">PEMROGRAMAN WEB</div>
      <div
        class="flex gap-8 font-bold text-sm uppercase tracking-widest items-center"
      >
        <a href="index.html" class="opacity-100 border-b-2 border-white"
          >Home</a
        >
        <a
          href="portofolio.html"
          class="opacity-70 hover:opacity-100 transition"
          >Portofolio</a
        >
        <a href="contact.html" class="opacity-70 hover:opacity-100 transition"
          >Contact</a
        >
        <button
          id="theme-toggle"
          class="p-2 bg-white/10 rounded-lg hover:bg-white/20 transition"
        >
          <span id="theme-toggle-icon">🌙</span>
        </button>
      </div>
    </nav>

    <section
      class="relative min-h-screen flex items-center px-10 overflow-hidden"
    >
      <div class="absolute inset-0 z-0">
        <div
          class="absolute inset-0 overlay-gradient dark:from-black/90 z-10"
        ></div>
        <img
          src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1352&q=80"
          alt="Latar belakang bertema pemrograman"
          class="w-full h-full object-cover"
        />
      </div>

      <div class="w-full lg:w-1/2 z-20 pt-10">
        <h1
          class="text-7xl lg:text-8xl font-black text-white leading-none tracking-tighter mb-6 text-shadow-custom"
        >
          Informatics
        </h1>
        <p
          class="text-white text-xl max-w-md mb-10 font-medium text-shadow-custom opacity-90 leading-relaxed"
        >
          Halo, saya <span class="font-black">Muhammad Annas Ardiansyah</span>,
          mahasiswa <span class="font-black">Teknik Informatika UMS</span>. Saya
          memiliki minat besar dalam pengembangan website modern dan sedang
          fokus mendalami HTML, CSS, serta JavaScript.
        </p>
        <a
          href="portofolio.html"
          class="inline-block bg-white text-rose-600 px-10 py-4 font-black uppercase text-sm tracking-widest hover:bg-slate-900 hover:text-white transition-all shadow-2xl"
          >Lihat Karya</a
        >
      </div>

      <div
        class="hidden lg:flex w-1/2 justify-center items-center z-20 relative"
      >
        <div
          class="absolute bg-white/10 dark:bg-rose-500/10 rounded-full w-[500px] h-[500px]"
        ></div>
        <div
          class="relative w-[450px] h-[450px] border-8 border-white rounded-full overflow-hidden bg-slate-800 shadow-2xl"
        >
          <img
            src="images/foto.jpg"
            alt="Foto Profil Muhammad Annas Ardiansyah"
            class="absolute inset-0 w-full h-[130%] object-cover -translate-y-[5%]"
          />
        </div>
      </div>
    </section>

    <script>
      const themeToggleBtn = document.getElementById("theme-toggle");
      const themeToggleIcon = document.getElementById("theme-toggle-icon");
      const updateIcon = () => {
        themeToggleIcon.innerText = document.documentElement.classList.contains(
          "dark",
        )
          ? "☀️"
          : "🌙";
      };
      updateIcon();
      themeToggleBtn.addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
        localStorage.setItem(
          "theme",
          document.documentElement.classList.contains("dark")
            ? "dark"
            : "light",
        );
        updateIcon();
      });
    </script>
  </body>
</html>
